# prefix: keep C-b, also accept C-a
set -g prefix2 C-a
bind C-a send-prefix -2

# basics
set -g mode-keys vi
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -s escape-time 10
set -g history-limit 50000
set -g display-time 1500
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"

# reload: prefix + r
bind r source-file ~/.config/tmux/tmux.conf \; display "reloaded"

# mouse toggle: prefix + m
bind m set -g mouse \; display "mouse #{?mouse,on,off}"

# hjkl pane movement
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R

# status-bar color, left and right text length
set -g status-style "fg=#8a8a8a,bg=#080808"
set -g status-left-length 100
set -g status-right-length 150

# left: session + uptime 
set -g status-left "#[fg=#080808,bg=#bb9af7,bold] ◆ #S #[fg=#c0caf5,bg=#3b4261,nobold] ↑ #(~/.config/tmux/uptime.sh) #[default] "

# right: prefix badge + mouse icon, time, date + host 
set -g status-right "#{?client_prefix,#[fg=#080808,bg=#bb9af7,bold] ⌨ PREFIX #[default] ,}#{?mouse,#[fg=#bb9af7]↗ #[default],}#[fg=#c0caf5,bg=#3b4261] %R #[fg=#080808,bg=#bb9af7,bold] %d %b | #h "

# windows
set -g window-status-format "#[fg=#8a8a8a] #I #W#{?window_bell_flag,!,}#{?window_zoomed_flag, Z,} "
set -g window-status-current-format "#[fg=#080808,bg=#bb9af7,bold] #I #W#{?window_zoomed_flag, Z,} "
set -g window-status-separator ""
set -g window-status-last-style "fg=#bb9af7"
set -g window-status-bell-style "fg=#bb9af7,bold,blink"

# panes
set -g pane-border-style "fg=#3b4261"
set -g pane-active-border-style "fg=#bb9af7"
set -g display-panes-colour "#bb9af7"
set -g display-panes-active-colour "#bb9af7"

# messages and copy mode
set -g message-style "fg=#080808,bg=#bb9af7,bold"
set -g message-command-style "fg=#bb9af7,bg=#080808,bold"
set -g mode-style "fg=#080808,bg=#bb9af7,bold"
setw -g clock-mode-colour "#bb9af7"

# ---------------- plugins ----------------
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'

# show a message whenever resurrect saves (manual prefix+Ctrl-s AND continuum autosave)
set -g @resurrect-hook-post-save-all 'tmux display-message "Session saved"'

# keep last
run '~/.config/tmux/plugins/tpm/tpm'   
