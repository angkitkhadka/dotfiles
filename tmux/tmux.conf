# prefix: keep C-b, also accept C-a
set -g prefix2 C-a
bind C-a send-prefix -2

# basics
set -g mode-keys vi
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -s escape-time 10
set -g history-limit 50000
set -g display-time 1500
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy 2>/dev/null || clip.exe 2>/dev/null || wl-copy 2>/dev/null || xclip -selection clipboard -in"

# reload: prefix + r
bind r source-file ~/.config/tmux/tmux.conf \; display "reloaded"

# mouse toggle: prefix + m
bind m set -g mouse \; display "mouse #{?mouse,on,off}"

# hjkl pane movement
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R

# status bar
set -g status-position bottom
set -g status-style "fg=#8a8a8a,bg=default"
set -g status-left-length 100
set -g status-right-length 150

# left: session (title case) + uptime
set -g status-left "#[fg=#080808,bg=#bb9af7,bold] #S #[fg=#c0caf5,bg=#3b4261,nobold] ↑ #(~/.config/tmux/uptime.sh) #[default] "

# right: prefix badge + mouse icon, weather, city, date
set -g status-right "#{?client_prefix,#[fg=#080808#,bg=#bb9af7#,bold] ⌨ PREFIX #[default] ,}#{?#{==:#{mouse},on},#[fg=#bb9af7]↗ #[default],}#[fg=#c0caf5,bg=#3b4261] #(~/.config/tmux/weather.sh temp) #[fg=#080808,bg=#7dcfff,bold] #(~/.config/tmux/weather.sh city) #[fg=#080808,bg=#bb9af7,bold] %d %b %R "

# windows
set -g window-status-format "#[fg=#8a8a8a] #I #W#{?window_bell_flag,!,}#{?window_zoomed_flag, Z,} "
set -g window-status-current-format "#[fg=#080808,bg=#bb9af7,bold] #I #W#{?window_zoomed_flag, Z,} "
set -g window-status-separator ""
set -g window-status-last-style "fg=#bb9af7"
set -g window-status-bell-style "fg=#bb9af7,bold,blink"

# panes
set -g pane-border-style "fg=#3b4261"
set -g pane-active-border-style "fg=#bb9af7"
set -g display-panes-colour "#bb9af7"
set -g display-panes-active-colour "#bb9af7"

# resize panes: prefix + H/J/K/L
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
set -g repeat-time 700

# messages and copy mode (green so messages stand out from the purple blocks)
set -g message-style "fg=#080808,bg=#9ece6a,bold"
set -g message-command-style "fg=#bb9af7,bg=#080808,bold"
set -g mode-style "fg=#080808,bg=#bb9af7,bold"
setw -g clock-mode-colour "#bb9af7"

# ---------------- plugins ----------------
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'

run '~/.config/tmux/plugins/tpm/tpm'

# manual save only: prefix + Ctrl-s (autosave stays silent); must come after tpm
bind C-s run-shell "~/.config/tmux/plugins/tmux-resurrect/scripts/save.sh quiet" \; display-message -d 600 "Session saved ✓"
